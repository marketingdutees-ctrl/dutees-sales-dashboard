    const ids = new Set(rows.map(r => r["Order ID"]).filter(Boolean));
    const value = rows.reduce((s, r) => s + (Number(r["Total Cost INR"]) || 0), 0);
    const rtoIds = new Set(
        rows.filter(r => String(r["Order Status"]).toLowerCase().includes("rto"))
            .map(r => r["Order ID"]).filter(Boolean)
    );

    document.querySelectorAll(".card .value")[0].textContent = ids.size;
    document.querySelectorAll(".card .value")[1].textContent =
        "₹" + value.toLocaleString("en-IN", {maximumFractionDigits:0});
    document.querySelectorAll(".card .value")[2].textContent = rtoIds.size;

    const dates = {};
    const status = {};
    const stateSales = {};
    const productOrders = {};
    const rtoCity = {};

    rows.forEach(r => {
        const date = String(r["Order Date"] || "").slice(0,10);
        if (date) dates[date] = (dates[date] || 0) + (Number(r["Total Cost INR"]) || 0);

        const st = r["Order Status"] || "Unknown";
        if (!status[st]) status[st] = new Set();
        if (r["Order ID"]) status[st].add(r["Order ID"]);

        const state = r.State || "Unknown";
        stateSales[state] = (stateSales[state] || 0) + (Number(r["Total Cost INR"]) || 0);

        const product = r["Product (individual)"] || "Unknown";
        if (!productOrders[product]) productOrders[product] = new Set();
        if (r["Order ID"]) productOrders[product].add(r["Order ID"]);

        if (String(st).toLowerCase().includes("rto")) {
            const city = r.City || "Unknown";
            if (!rtoCity[city]) rtoCity[city] = new Set();
            if (r["Order ID"]) rtoCity[city].add(r["Order ID"]);
        }
    });

    const top = obj => Object.entries(obj)
        .map(([k,v]) => [k, v instanceof Set ? v.size : v])
        .sort((a,b) => b[1]-a[1]).slice(0,10);

    const dateRows = Object.entries(dates).sort((a,b)=>a[0].localeCompare(b[0]));

    Plotly.react("chart0", [{
        x:dateRows.map(x=>x[0]), y:dateRows.map(x=>x[1]),
        type:"scatter", mode:"lines+markers", name:"Order value"
    }], {title:"Daily Order Value", yaxis:{title:"INR"}});

    const statusRows = Object.entries(status).map(([k,v])=>[k,v.size]);
    Plotly.react("chart1", [{
        labels:statusRows.map(x=>x[0]), values:statusRows.map(x=>x[1]),
        type:"pie"
    }], {title:"Order Status Distribution"});

    const stateRows = top(stateSales);
    Plotly.react("chart2", [{
        x:stateRows.map(x=>x[0]), y:stateRows.map(x=>x[1]), type:"bar"
    }], {title:"Top States by Order Value", yaxis:{title:"INR"}});

    const productRows = top(productOrders);
    Plotly.react("chart3", [{
        x:productRows.map(x=>x[1]), y:productRows.map(x=>x[0]),
        type:"bar", orientation:"h"
    }], {title:"Top Product Descriptions by Unique Orders"});

    const cityRows = top(rtoCity);
    Plotly.react("chart4", [{
        x:cityRows.map(x=>x[0]), y:cityRows.map(x=>x[1]), type:"bar"
    }], {title:"Top Cities by RTO Orders"});
}

function applyFilters() {
    const state = document.getElementById("stateFilter").value;
    const city = document.getElementById("cityFilter").value;

    const rows = originalRows.filter(r =>
        (state === "All" || r.State === state) &&
        (city === "All" || r.City === city)
    );
    drawCharts(rows);
}

drawCharts(originalRows);
</script>
</body>
</html>
